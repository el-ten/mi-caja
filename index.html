<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Mi Caja</title>
  <meta name="description" content="Tus gastos e ingresos, siempre a mano. Funciona sin señal.">
  <meta name="theme-color" content="#0f3d2c">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Caja">
  <!-- "default": la app no se dibuja debajo de la barra de estado (igual que Don Enrique) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="edge-band" aria-hidden="true"></div>
  <header class="appbar" id="appbar">
    <div class="brand">
      <span class="logo" id="brandLogo" aria-hidden="true"></span>
      <div class="brand-text"><b>Mi Caja</b><small>Finanzas personales</small></div>
    </div>
    <button class="sync-pill" id="sync" type="button" hidden></button>
  </header>
  <div class="update-bar" id="update" hidden><span>Hay una versión nueva de Mi Caja.</span><button id="applyUpdate" type="button">Actualizar</button></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
  <div id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>Mi Caja necesita JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
