<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Mi Caja</title>
  <meta name="description" content="Tus gastos e ingresos, siempre a mano. Funciona sin señal.">
  <meta name="theme-color" content="#0f3d2c">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Caja">
  <!-- "default": la app no se dibuja debajo de la barra de estado (igual que Don Enrique) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <script>
    // Android: sin "viewport-fit=cover" el navegador deja la app entre la barra de estado y la de navegación
    // (algunos, como Samsung Internet, dibujan por debajo de las barras sin avisar cuánto tapan). En el iPhone se mantiene.
    (function () {
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!ios) document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1');
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="edge-band" aria-hidden="true"></div>
  <header class="appbar" id="appbar">
    <div class="brand">
      <span class="logo" id="brandLogo" aria-hidden="true"></span>
      <div class="brand-text"><b>Mi Caja</b><small>Finanzas personales</small></div>
    </div>
    <button class="sync-pill" id="sync" type="button" hidden></button>
  </header>
  <script>
    // La barra de arriba queda fija (no rebota con el scroll del iPhone). Se mide su alto para dejarle lugar al contenido.
    (function () { var a = document.getElementById('appbar'); if (!a) return; function m() { document.documentElement.style.setProperty('--appbar-h', a.offsetHeight + 'px'); } m(); addEventListener('resize', m); if (window.ResizeObserver) new ResizeObserver(m).observe(a); })();
  </script>
  <script>
    // Encabezado verde fijo (ver detail-head en app.css): se mide su alto para dejarle lugar al contenido.
    (function () {
      var ro = window.ResizeObserver ? new ResizeObserver(function (e) { set(e[0].target); }) : null, cur = null;
      function set(el) { document.documentElement.style.setProperty('--dh-h', el.offsetHeight + 'px'); }
      function check() {
        var v = document.getElementById('view'), el = v && v.querySelector('.page > .detail-head:first-child');
        if (el === cur) return;
        if (ro && cur) ro.unobserve(cur);
        cur = el;
        if (el) { set(el); if (ro) ro.observe(el); }
      }
      document.addEventListener('DOMContentLoaded', function () { var v = document.getElementById('view'); if (v) new MutationObserver(check).observe(v, { childList: true, subtree: true }); check(); });
    })();
  </script>
  <div class="update-bar" id="update" hidden><span>Hay una versión nueva de Mi Caja.</span><button id="applyUpdate" type="button">Actualizar</button></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
  <div id="overlay"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript>Mi Caja necesita JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
